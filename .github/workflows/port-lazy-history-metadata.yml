name: Apply lazy history metadata port

on:
  push:
    branches:
      - port/lazy-history-metadata

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted source edits
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          # Per-client metadata snapshots live on the actor, so history from one
          # custom session/base URL cannot contaminate another client.
          replace_once(
              "Sources/YFinanceKit/YFinanceClient.swift",
              """    private let rootBaseURL: URL\n    private let crumbStore: YFCrumbStore\n\n    private func normalizedTimeout""",
              """    private let rootBaseURL: URL\n    private let crumbStore: YFCrumbStore\n    var historyMetadataSnapshots: [String: YFStoredHistoryMetadata] = [:]\n\n    private func normalizedTimeout""",
          )

          # Capture the exact raw Yahoo chart metadata after a successful typed
          # decode, without issuing another request.
          replace_once(
              "Sources/YFinanceKit/YFinanceClient.swift",
              """        do {\n            return try decoder.decode(T.self, from: data)\n        } catch {\n            throw YFinanceError.decoding(error)\n        }""",
              """        do {\n            let value = try decoder.decode(T.self, from: data)\n            recordHistoryMetadataSnapshotIfPresent(\n                data: data,\n                path: path,\n                queryItems: queryItems\n            )\n            return value\n        } catch {\n            throw YFinanceError.decoding(error)\n        }""",
          )

          # Preserve the existing no-argument ticker API while making intraday
          # trading-period enrichment explicit.
          replace_once(
              "Sources/YFinanceKit/YFinanceTicker.swift",
              """    public func historyMetadata() async throws -> YFJSONValue {\n        // Python yfinance requests intraday history so Yahoo returns tradingPeriods in metadata.\n        let raw = try await client.historyRaw(symbol: symbol, range: .fiveDays, interval: .oneHour, includePrePost: true)\n        return raw[\"chart\"]?[\"result\"]?[0]?[\"meta\"] ?? .object([:])\n    }""",
              """    public func historyMetadata() async throws -> YFJSONValue {\n        try await client.robustHistoryMetadata(symbol: symbol).metadata\n    }\n\n    public func historyMetadata(includeTradingPeriods: Bool) async throws -> YFJSONValue {\n        try await client.robustHistoryMetadata(\n            symbol: symbol,\n            includeTradingPeriods: includeTradingPeriods\n        ).metadata\n    }""",
          )

          # Keep the protocol-compatible resilient method, then expose an
          # overload whose single-flight key distinguishes base vs enrichment.
          replace_once(
              "Sources/YFinanceKit/YFinanceResilience.swift",
              """    public func historyMetadata(\n        symbol: String,\n        timeout: TimeInterval? = 10\n    ) async throws -> YFHistoryMetadataResult {\n        let symbol = Self.cleanSymbol(symbol)\n        if let existing = metadataFlights[symbol] {\n            await coordinator.noteCoalescedRequest()\n            return try await existing.value\n        }\n\n        let client = self.client\n        let coordinator = self.coordinator\n        let task = Task<YFHistoryMetadataResult, Error> {\n            try await coordinator.execute(endpoint: \"history-metadata\", resource: symbol) {\n                try await client.robustHistoryMetadata(symbol: symbol, timeout: timeout)\n            }\n        }\n        metadataFlights[symbol] = task\n        defer { metadataFlights[symbol] = nil }\n        return try await task.value\n    }""",
              """    public func historyMetadata(\n        symbol: String,\n        timeout: TimeInterval? = 10\n    ) async throws -> YFHistoryMetadataResult {\n        try await historyMetadata(\n            symbol: symbol,\n            includeTradingPeriods: false,\n            timeout: timeout\n        )\n    }\n\n    public func historyMetadata(\n        symbol: String,\n        includeTradingPeriods: Bool,\n        timeout: TimeInterval? = 10\n    ) async throws -> YFHistoryMetadataResult {\n        let symbol = Self.cleanSymbol(symbol)\n        let flightKey = \"\\(symbol)|tradingPeriods:\\(includeTradingPeriods ? 1 : 0)\"\n        if let existing = metadataFlights[flightKey] {\n            await coordinator.noteCoalescedRequest()\n            return try await existing.value\n        }\n\n        let client = self.client\n        let coordinator = self.coordinator\n        let task = Task<YFHistoryMetadataResult, Error> {\n            try await coordinator.execute(endpoint: \"history-metadata\", resource: symbol) {\n                try await client.robustHistoryMetadata(\n                    symbol: symbol,\n                    includeTradingPeriods: includeTradingPeriods,\n                    timeout: timeout\n                )\n            }\n        }\n        metadataFlights[flightKey] = task\n        defer { metadataFlights[flightKey] = nil }\n        return try await task.value\n    }""",
          )

          Path("Sources/YFinanceKit/YFinanceHistoryMetadata.swift").write_text(r'''import Foundation

struct YFStoredHistoryMetadata: Sendable {
    let metadata: YFJSONValue
    let intervalUsed: YFinanceClient.Interval
}

public struct YFHistoryMetadataResult: Sendable {
    public let metadata: YFJSONValue
    public let intervalUsed: YFinanceClient.Interval
    public let hasTradingPeriods: Bool

    public init(
        metadata: YFJSONValue,
        intervalUsed: YFinanceClient.Interval,
        hasTradingPeriods: Bool
    ) {
        self.metadata = metadata
        self.intervalUsed = intervalUsed
        self.hasTradingPeriods = hasTradingPeriods
    }
}

private func yfMetadataHasTradingPeriods(_ metadata: YFJSONValue) -> Bool {
    guard let tradingPeriods = metadata["tradingPeriods"] else { return false }
    switch tradingPeriods {
    case .null:
        return false
    case .array(let values):
        return !values.isEmpty
    case .object(let values):
        return !values.isEmpty
    default:
        return true
    }
}

extension YFinanceClient {
    /// Records the exact raw Yahoo metadata from a successful typed chart
    /// response. This is deliberately actor-local so separate client sessions
    /// cannot leak metadata into one another.
    func recordHistoryMetadataSnapshotIfPresent(
        data: Data,
        path: String,
        queryItems: [URLQueryItem]
    ) {
        let prefix = "/v8/finance/chart/"
        guard path.hasPrefix(prefix) else { return }

        let rawSymbol = String(path.dropFirst(prefix.count))
        let symbol = (rawSymbol.removingPercentEncoding ?? rawSymbol)
            .trimmingCharacters(in: .whitespacesAndNewlines)
            .uppercased()
        guard !symbol.isEmpty,
              let raw = try? YFJSONValue.decode(data: data),
              let metadata = raw["chart"]?["result"]?[0]?["meta"],
              metadata.objectValue != nil else {
            return
        }

        let interval = queryItems
            .first(where: { $0.name == "interval" })?
            .value
            .flatMap { YFinanceClient.Interval(pythonValue: $0) }
            ?? .oneDay

        historyMetadataSnapshots[symbol] = YFStoredHistoryMetadata(
            metadata: metadata,
            intervalUsed: interval
        )
    }
}

public extension YFinanceClient {
    /// Returns core history metadata without paying for intraday enrichment.
    /// If a normal chart request already ran on this client, its exact Yahoo
    /// `meta` object is reused and this method performs no chart request.
    func robustHistoryMetadata(
        symbol: String,
        timeout: TimeInterval? = 10
    ) async throws -> YFHistoryMetadataResult {
        try await robustHistoryMetadata(
            symbol: symbol,
            includeTradingPeriods: false,
            timeout: timeout
        )
    }

    /// Returns history metadata, optionally enriching `tradingPeriods` with the
    /// `5d/1h` request Yahoo requires for that field. Intraday enrichment is
    /// best-effort and never invalidates otherwise-valid core metadata.
    func robustHistoryMetadata(
        symbol: String,
        includeTradingPeriods: Bool,
        timeout: TimeInterval? = 10
    ) async throws -> YFHistoryMetadataResult {
        let symbol = symbol
            .trimmingCharacters(in: .whitespacesAndNewlines)
            .uppercased()
        guard !symbol.isEmpty else {
            throw YFinanceError.invalidRequest("symbol cannot be empty")
        }

        if let cached = historyMetadataSnapshots[symbol] {
            return await historyMetadataResult(
                symbol: symbol,
                base: cached,
                includeTradingPeriods: includeTradingPeriods,
                timeout: timeout
            )
        }

        let raw = try await historyRaw(
            symbol: symbol,
            range: .fiveDays,
            interval: .oneDay,
            includePrePost: true,
            events: [],
            timeout: timeout
        )

        if let reason = raw["chart"]?["error"]?["description"]?.stringValue,
           !reason.trimmingCharacters(in: .whitespacesAndNewlines).isEmpty {
            throw YFinanceError.missingData(reason)
        }

        guard let metadata = raw["chart"]?["result"]?[0]?["meta"],
              metadata.objectValue != nil else {
            throw YFinanceError.missingData(
                "No history metadata returned for \(symbol)"
            )
        }

        let base = YFStoredHistoryMetadata(
            metadata: metadata,
            intervalUsed: .oneDay
        )
        historyMetadataSnapshots[symbol] = base

        return await historyMetadataResult(
            symbol: symbol,
            base: base,
            includeTradingPeriods: includeTradingPeriods,
            timeout: timeout
        )
    }

    private func historyMetadataResult(
        symbol: String,
        base: YFStoredHistoryMetadata,
        includeTradingPeriods: Bool,
        timeout: TimeInterval?
    ) async -> YFHistoryMetadataResult {
        if !includeTradingPeriods || yfMetadataHasTradingPeriods(base.metadata) {
            return YFHistoryMetadataResult(
                metadata: base.metadata,
                intervalUsed: base.intervalUsed,
                hasTradingPeriods: yfMetadataHasTradingPeriods(base.metadata)
            )
        }

        do {
            let raw = try await historyRaw(
                symbol: symbol,
                range: .fiveDays,
                interval: .oneHour,
                includePrePost: true,
                events: [],
                timeout: timeout
            )

            guard let intradayMetadata = raw["chart"]?["result"]?[0]?["meta"],
                  let tradingPeriods = intradayMetadata["tradingPeriods"],
                  var merged = base.metadata.objectValue else {
                return YFHistoryMetadataResult(
                    metadata: base.metadata,
                    intervalUsed: base.intervalUsed,
                    hasTradingPeriods: false
                )
            }

            merged["tradingPeriods"] = tradingPeriods
            if merged["exchangeTimezoneName"] == nil,
               let timezone = intradayMetadata["exchangeTimezoneName"] {
                merged["exchangeTimezoneName"] = timezone
            }

            let enrichedMetadata = YFJSONValue.object(merged)
            guard yfMetadataHasTradingPeriods(enrichedMetadata) else {
                return YFHistoryMetadataResult(
                    metadata: base.metadata,
                    intervalUsed: base.intervalUsed,
                    hasTradingPeriods: false
                )
            }

            let enriched = YFStoredHistoryMetadata(
                metadata: enrichedMetadata,
                intervalUsed: .oneHour
            )
            historyMetadataSnapshots[symbol] = enriched
            return YFHistoryMetadataResult(
                metadata: enriched.metadata,
                intervalUsed: enriched.intervalUsed,
                hasTradingPeriods: true
            )
        } catch {
            return YFHistoryMetadataResult(
                metadata: base.metadata,
                intervalUsed: base.intervalUsed,
                hasTradingPeriods: false
            )
        }
    }
}

public extension YF {
    static func historyMetadata(
        _ symbol: String,
        timeout: TimeInterval? = 10,
        client: YFinanceClient = YFinanceClient()
    ) async throws -> YFHistoryMetadataResult {
        try await client.robustHistoryMetadata(symbol: symbol, timeout: timeout)
    }

    static func historyMetadata(
        _ symbol: String,
        includeTradingPeriods: Bool,
        timeout: TimeInterval? = 10,
        client: YFinanceClient = YFinanceClient()
    ) async throws -> YFHistoryMetadataResult {
        try await client.robustHistoryMetadata(
            symbol: symbol,
            includeTradingPeriods: includeTradingPeriods,
            timeout: timeout
        )
    }
}
''')

          Path("Tests/YFinanceKitTests/YFinanceHistoryMetadataTests.swift").write_text(r'''import Foundation
import XCTest
@testable import YFinanceKit

final class YFinanceHistoryMetadataTests: XCTestCase {
    func testHistoryThenMetadataReusesChartResponse() async throws {
        let configuration = URLSessionConfiguration.ephemeral
        configuration.protocolClasses = [MetadataURLProtocol.self]
        let client = YFinanceClient(session: URLSession(configuration: configuration))
        let requests = MetadataRequestRecorder()

        MetadataURLProtocol.handler = { request in
            guard let url = request.url else { throw MetadataTestError.missingURL }
            if url.host == "fc.yahoo.com" {
                return Self.response(url: url, body: "ok", contentType: "text/plain")
            }
            if url.path == "/v1/test/getcrumb" {
                return Self.response(url: url, body: "meta-crumb", contentType: "text/plain")
            }
            if url.path.hasPrefix("/v8/finance/chart/") {
                requests.record(Self.interval(from: url))
                return Self.response(url: url, body: Self.aaplHistoryBody)
            }
            throw MetadataTestError.unexpectedURL(url.absoluteString)
        }
        defer { MetadataURLProtocol.handler = nil }

        _ = try await client.history(
            symbol: "AAPL",
            range: .fiveDays,
            interval: .oneDay,
            events: [],
            autoAdjust: false
        )

        let ticker = client.ticker("AAPL")
        let metadata = try await ticker.historyMetadata()

        XCTAssertEqual(metadata["currency"]?.stringValue, "USD")
        XCTAssertEqual(metadata["exchangeTimezoneName"]?.stringValue, "America/New_York")
        XCTAssertEqual(requests.snapshot(), ["1d"])
    }

    func testTradingPeriodsFetchesHourlyOnlyWhenRequested() async throws {
        let configuration = URLSessionConfiguration.ephemeral
        configuration.protocolClasses = [MetadataURLProtocol.self]
        let client = YFinanceClient(session: URLSession(configuration: configuration))
        let requests = MetadataRequestRecorder()

        MetadataURLProtocol.handler = { request in
            guard let url = request.url else { throw MetadataTestError.missingURL }
            if url.host == "fc.yahoo.com" {
                return Self.response(url: url, body: "ok", contentType: "text/plain")
            }
            if url.path == "/v1/test/getcrumb" {
                return Self.response(url: url, body: "meta-crumb", contentType: "text/plain")
            }
            if url.path.hasPrefix("/v8/finance/chart/") {
                let interval = Self.interval(from: url)
                requests.record(interval)
                if interval == "1h" {
                    return Self.response(url: url, body: Self.hourlyMetadataBody)
                }
                return Self.response(url: url, body: Self.dailyMetadataBody)
            }
            throw MetadataTestError.unexpectedURL(url.absoluteString)
        }
        defer { MetadataURLProtocol.handler = nil }

        let base = try await client.robustHistoryMetadata(symbol: "ROG.SW")
        XCTAssertEqual(base.metadata["currency"]?.stringValue, "CHF")
        XCTAssertFalse(base.hasTradingPeriods)
        XCTAssertEqual(requests.snapshot(), ["1d"])

        let enriched = try await client.robustHistoryMetadata(
            symbol: "ROG.SW",
            includeTradingPeriods: true
        )
        XCTAssertTrue(enriched.hasTradingPeriods)
        XCTAssertEqual(enriched.intervalUsed, .oneHour)
        XCTAssertEqual(requests.snapshot(), ["1d", "1h"])

        _ = try await client.robustHistoryMetadata(
            symbol: "ROG.SW",
            includeTradingPeriods: true
        )
        XCTAssertEqual(requests.snapshot(), ["1d", "1h"])
    }

    func testFailedTradingPeriodsEnrichmentKeepsCoreMetadata() async throws {
        let configuration = URLSessionConfiguration.ephemeral
        configuration.protocolClasses = [MetadataURLProtocol.self]
        let client = YFinanceClient(session: URLSession(configuration: configuration))
        let requests = MetadataRequestRecorder()

        MetadataURLProtocol.handler = { request in
            guard let url = request.url else { throw MetadataTestError.missingURL }
            if url.host == "fc.yahoo.com" {
                return Self.response(url: url, body: "ok", contentType: "text/plain")
            }
            if url.path == "/v1/test/getcrumb" {
                return Self.response(url: url, body: "meta-crumb", contentType: "text/plain")
            }
            if url.path.hasPrefix("/v8/finance/chart/") {
                let interval = Self.interval(from: url)
                requests.record(interval)
                if interval == "1h" {
                    return Self.response(
                        url: url,
                        body: #"{"chart":{"result":null,"error":{"code":"Not Found","description":"No intraday data"}}}"#
                    )
                }
                return Self.response(url: url, body: Self.dailyMetadataBody)
            }
            throw MetadataTestError.unexpectedURL(url.absoluteString)
        }
        defer { MetadataURLProtocol.handler = nil }

        let result = try await client.robustHistoryMetadata(
            symbol: "ROG.SW",
            includeTradingPeriods: true
        )

        XCTAssertEqual(result.metadata["currency"]?.stringValue, "CHF")
        XCTAssertEqual(result.metadata["exchangeTimezoneName"]?.stringValue, "Europe/Zurich")
        XCTAssertFalse(result.hasTradingPeriods)
        XCTAssertEqual(result.intervalUsed, .oneDay)
        XCTAssertEqual(requests.snapshot(), ["1d", "1h"])
    }

    private static func interval(from url: URL) -> String {
        URLComponents(url: url, resolvingAgainstBaseURL: false)?
            .queryItems?
            .first(where: { $0.name == "interval" })?
            .value ?? ""
    }

    private static let dailyMetadataBody = #"{"chart":{"result":[{"meta":{"currency":"CHF","symbol":"ROG.SW","exchangeName":"EBS","instrumentType":"EQUITY","exchangeTimezoneName":"Europe/Zurich"},"timestamp":[],"indicators":{"quote":[{}]}}],"error":null}}"#

    private static let hourlyMetadataBody = #"{"chart":{"result":[{"meta":{"currency":"CHF","symbol":"ROG.SW","exchangeName":"EBS","instrumentType":"EQUITY","exchangeTimezoneName":"Europe/Zurich","tradingPeriods":{"regular":[[{"timezone":"CET","start":1787020800,"end":1787051400,"gmtoffset":7200}]]}},"timestamp":[],"indicators":{"quote":[{}]}}],"error":null}}"#

